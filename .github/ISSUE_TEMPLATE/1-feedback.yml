name: "Tried Waymark: my feedback"
description: You used Waymark for a while. Tell us what worked, what didn't, and what you'd change.
title: "Feedback: "
labels: ["feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for trying Waymark! This takes about 3 minutes. Everything you write here is **public**, so don't paste private notes.
  - type: dropdown
    id: who
    attributes:
      label: Who are you?
      options:
        - Student (college)
        - Student (school)
        - Working / self-learner
        - Teacher or mentor
        - Other
    validations:
      required: true
  - type: dropdown
    id: used
    attributes:
      label: How did you use it?
      multiple: true
      options:
        - Planned a subject or course
        - Planned a project
        - Studied with Claude / ChatGPT / another AI writing into my notes
        - Just looked around
  - type: dropdown
    id: ai
    attributes:
      label: Which AI did you connect, if any?
      multiple: true
      options:
        - Claude (app or Claude Code)
        - ChatGPT / Codex
        - Gemini
        - Cursor / VS Code / Copilot
        - None
        - I tried but couldn't connect it
  - type: dropdown
    id: rating
    attributes:
      label: Overall, how useful was it?
      options:
        - "5: I'll keep using it"
        - "4: Useful"
        - "3: OK"
        - "2: Not really"
        - "1: Not for me"
    validations:
      required: true
  - type: textarea
    id: liked
    attributes:
      label: What did you like most?
  - type: textarea
    id: confusing
    attributes:
      label: What was confusing, slow or annoying?
      description: Where did you get stuck? Screenshots help (drag them in).
  - type: textarea
    id: change
    attributes:
      label: If you could change one thing, what would it be?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Waymark version and computer
      description: "Help → About Waymark shows the version. For example: 0.1.3, Windows 11"
