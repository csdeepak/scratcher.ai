name: Something went wrong
description: A bug, a crash, an error message, or something that didn't work as expected.
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Everything here is **public**. Don't paste private notes; a screenshot with them blurred is fine.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: And what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we make it happen again?
      placeholder: |
        1. Open a roadmap
        2. Click …
        3. See …
  - type: input
    id: version
    attributes:
      label: Waymark version and computer
      description: "Help → About Waymark shows the version. For example: 0.1.3, Windows 11"
    validations:
      required: true
